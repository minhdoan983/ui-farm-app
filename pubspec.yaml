name: ui_farm
description: "just a online shop" 
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  flutter_launcher_icons: 0.14.4
  flutter_gen_runner: 5.13.0+1
  flutter_svg: 2.2.2
  auto_route: 11.1.0
  carousel_slider: 5.1.2
  url_launcher: 6.3.0
  flutter_bloc: 9.1.1
  freezed: 3.2.5
  freezed_annotation: 3.1.0
  get_it: 9.2.1
  injectable: 2.7.1+4
  dio: 5.9.2
  bloc: 9.2.0
  json_annotation: 4.11.0
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  build_runner: 2.13.1
  auto_route_generator: 10.5.0
  lean_builder: 0.1.7
  injectable_generator: 2.12.1
  json_serializable: 6.13.2


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Playwrite Cuba
      fonts:
        - asset: assets/fonts/PlaywriteCU-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 

  # fluttergen
flutter_gen:
  output: lib/resources/gen
  line_length: 100

  integrations:
    flutter_svg: true
    lottie: true