name: ui_farm
description: "just a online shop"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: 9.1.1
  bloc: 9.2.0
  bloc_concurrency: 0.3.0

  # UI
  flutter_svg: 2.2.2
  url_launcher: 6.3.0
  cupertino_icons: 1.0.9
  carousel_slider: 5.1.2

  # DI
  get_it: 9.2.1
  injectable: 2.7.1+4

  # Utils
  freezed_annotation: 3.1.0
  json_annotation: 4.11.0
  intl: 0.20.2
  rxdart: 0.28.0
  image_picker: 1.2.2

  # Local storage
  shared_preferences: 2.5.5
  flutter_secure_storage: 10.1.0

  # Networking
  dio: 5.9.2

  # Routing
  auto_route: 11.1.0

  # Codegen helpers (runtime)
  flutter_gen_runner: 5.13.0+1
  flutter_launcher_icons: 0.14.4
  intl_utils: 2.8.14

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 5.0.0
  build_runner: 2.13.1
  lean_builder: 0.1.7
  auto_route_generator: 10.5.0
  injectable_generator: 2.12.1
  json_serializable: 6.13.2
  freezed: 3.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Playwrite Cuba
      fonts:
        - asset: assets/fonts/PlaywriteCU-Regular.ttf
          weight: 400

# fluttergen
flutter_gen:
  output: lib/resources/gen
  line_length: 100

  integrations:
    flutter_svg: true
    lottie: true

# dart run flutter_launcher_icons:main
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21

# dart run intl_utils:generate
flutter_intl:
  enabled: true
  main_locale: vi
  arb_dir: lib/resources/l10n
  output_dir: lib/resources/l10n/generated
